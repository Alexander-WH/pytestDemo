name: API Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4

      - name: 拉取被测服务
        uses: actions/checkout@v4
        with:
          repository: Alexander-WH/flaskDemo
          path: _flaskDemo

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            _flaskDemo/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r _flaskDemo/requirements.txt
          pip install cryptography

      - name: 生成被测服务配置
        run: |
          cd _flaskDemo
          sed -e 's/"your_mysql_password_here"/"root"/' \
              -e 's/"your_redis_password_here"/None/' \
              config/setting.example.py > config/setting.py
          echo "已生成 config/setting.py（密码不回显）"

      - name: 等待中间件就绪并初始化数据库
        run: |
          mysql_ready=0
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              mysql_ready=1
              echo "MySQL 就绪（第 ${i} 次探测）"
              break
            fi
            sleep 2
          done
          if [ "$mysql_ready" != "1" ]; then
            echo "MySQL 60 秒内未就绪，终止"
            exit 1
          fi

          redis_ready=0
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              redis_ready=1
              echo "Redis 就绪（第 ${i} 次探测）"
              break
            fi
            sleep 1
          done
          if [ "$redis_ready" != "1" ]; then
            echo "Redis 20 秒内未就绪，终止"
            exit 1
          fi

          mysql -h 127.0.0.1 -uroot -proot < _flaskDemo/init.sql
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT id,username,role FROM test.user;"

          echo "--- 用 PyMySQL 探一次连接（和用例同一个驱动）---"
          python - <<'PY'
          import pymysql

          conn = pymysql.connect(host="127.0.0.1", port=3306, user="root",
                                 password="root", db="test")
          print("PyMySQL 认证成功，服务端版本", conn.get_server_info())
          conn.close()
          PY

      - name: 生成测试配置
        run: |
          cp config/setting.example.ini config/setting.ini
          sed -i 's/your_mysql_password_here/root/' config/setting.ini
          echo "已生成 config/setting.ini（密码不回显）"

      - name: 启动被测服务
        run: |
          cd _flaskDemo
          nohup python -c "from api.user import app; app.run(host='127.0.0.1', port=9999, debug=False, use_reloader=False)" > ../flask.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/ > /dev/null; then
              echo "被测服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "被测服务启动失败，日志如下："
          cat ../flask.log
          exit 1

      - name: 准备批量用户（test_06 依赖，按 JSON 原样注册）
        run: |
          python - <<'PY'
          import json
          import sys

          import requests

          path = "data/generated_users.json"
          users = json.load(open(path, encoding="utf-8"))
          base = "http://127.0.0.1:9999"

          created = existed = failed = 0
          for item in users:
              payload = {
                  "username": item["username"],
                  "password": "123456",
                  "sex": "0",
                  "telephone": item["telephone"],
                  "address": "CI",
              }
              body = requests.post(f"{base}/register", json=payload, timeout=10).json()
              code = body.get("code")
              if code == 0:
                  created += 1
              elif code in (2002, 2005):
                  existed += 1
              else:
                  failed += 1
                  print(f"  注册失败 {item['username']}: {body}")

          print(f"共 {len(users)} 条 -> 新建 {created}，已存在 {existed}，失败 {failed}")
          if failed or created + existed != len(users):
              sys.exit(1)
          PY

      - name: 校验批量用户已落库
        run: |
          mysql -h 127.0.0.1 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM test.user WHERE username LIKE 'test_user_%'" | tee count.txt
          total=$(cat count.txt)
          if [ "$total" -lt 50 ]; then
            echo "批量用户不足：期望 50，实际 $total"
            exit 1
          fi
          echo "批量用户已就绪：$total 条"

      - name: 运行接口测试
        run: pytest testcases -q --alluredir=allure-results

      - name: 上传 Allure 原始结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
          if-no-files-found: ignore

      - name: 失败时打印被测服务日志
        if: failure()
        run: |
          echo "===== flask.log ====="
          tail -n 120 flask.log || true
